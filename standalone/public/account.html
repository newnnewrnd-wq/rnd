<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>내 계정 · NEW&NEW Formula Lab</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/auth/accounts.css"></head><body><header class="account-header"><a class="auth-brand" href="/">NEW<span>&</span>NEW <small>FORMULA LAB</small></a><a href="/" class="nav-link" id="workspaceLink">배합 시뮬레이터로</a></header><main class="account-main"><div class="eyebrow">MY ACCOUNT</div><h1>내 계정</h1><p class="description" id="userSummary">계정 정보를 확인하고 있습니다.</p><div id="mustChange" class="notice" hidden>임시 비밀번호로 로그인했습니다. 새 비밀번호를 설정하면 시뮬레이터를 사용할 수 있습니다.</div><section class="account-card"><h2>비밀번호 변경</h2><p class="description">변경하면 다른 기기의 로그인도 해제됩니다.</p><form id="passwordForm"><label for="currentPassword">현재 비밀번호</label><input id="currentPassword" type="password" autocomplete="current-password" required maxlength="128"><label for="newPassword">새 비밀번호</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="15" maxlength="128"><p class="field-note">15~128자. 공백을 포함한 긴 문장도 사용할 수 있습니다.</p><label for="confirmPassword">새 비밀번호 확인</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="15" maxlength="128"><div id="error" class="notice error" role="alert" hidden></div><div id="success" class="notice good" role="status" hidden></div><button class="btn primary" id="changeButton" type="submit">비밀번호 변경</button></form></section><div class="account-actions"><a class="btn" href="/admin" id="adminLink" hidden>직원 계정 관리</a><button class="btn" id="logoutButton">로그아웃</button></div><p class="field-note">처방을 편집 중이었다면 해당 화면에서 CSV를 내려받아 보관하세요.</p></main><script type="module" src="/auth/account.js"></script></body></html>
